name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: pip install playwright numpy pillow
      - run: python -m playwright install --with-deps chrome   # harness.py launches channel='chrome'
      - run: python tests/reference.py      # regenerated art matches the shipped files
      - run: python tests/compare.py        # site pixels vs compose(), every tick
      - run: python tests/behaviour.py      # layout, commands, terminal, scheduler, folder
      - run: python tests/achievements.py
      - run: python tests/sound.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/results

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }                   # the site is the repo root, no build step
      - id: deployment
        uses: actions/deploy-pages@v4
